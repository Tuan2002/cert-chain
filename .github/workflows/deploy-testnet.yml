name: Deploy to Ethereum Sepolia Testnet

on:
  push:
    branches:
     - develop

jobs:
  test:
    name: Test Contracts
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: forge test --gas-report
        id: test

      - name: Generate test summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Sepolia
    runs-on: ubuntu-latest
    needs: test
    environment: Development

    outputs:
      deployer-address: ${{ steps.deploy.outputs.deployer-address }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build --sizes
        id: build

      - name: Verify environment variables
        run: |
          if [ -z "${{ vars.SEPOLIA_RPC_URL }}" ]; then
            echo "SEPOLIA_RPC_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OWNER_WALLET_PRIVATE_KEY }}" ]; then
            echo "PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "Environment variables verified"

      - name: Deploy contracts
        id: deploy
        env:
          RPC_URL: ${{ vars.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.OWNER_WALLET_PRIVATE_KEY }}
        run: |
          echo "🚀 Starting deployment to Sepolia testnet..."
          forge script script/Deploy.s.sol:DeployScript \
                --rpc-url $RPC_URL \
                --private-key $PRIVATE_KEY \
                --broadcast \
                --verify \
                --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }} \
                --slow \
                -vvvv
          # Extract deployer address
          DEPLOYER_ADDRESS=$(cast wallet address --private-key $PRIVATE_KEY)
          echo "deployer-address=$DEPLOYER_ADDRESS" >> $GITHUB_OUTPUT

      - name: Generate deployment summary
        continue-on-error: true
        run: |
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Deployment successful to Sepolia testnet!" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Deployer:** \`${{ steps.deploy.outputs.deployer-address }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Load contract addresses from the text file
            if [ -f "deployment-addresses.txt" ]; then
              echo "### 📋 Deployed Contract Addresses" >> $GITHUB_STEP_SUMMARY
              echo "| Contract Name | Address | Etherscan |" >> $GITHUB_STEP_SUMMARY
              echo "|---------------|---------|-----------|" >> $GITHUB_STEP_SUMMARY
              
              # Source the deployment addresses file
              source deployment-addresses.txt
              
              # Add each contract to the table if it exists
              [ -n "$ORGANIZATION_CONTRACT" ] && echo "| **Organization** | \`$ORGANIZATION_CONTRACT\` | [View](${{vars.EXPLORE_URL}}/address/$ORGANIZATION_CONTRACT) |" >> $GITHUB_STEP_SUMMARY
              [ -n "$CERTIFICATE_TYPE_CONTRACT" ] && echo "| **CertificateType** | \`$CERTIFICATE_TYPE_CONTRACT\` | [View](${{vars.EXPLORE_URL}}/address/$CERTIFICATE_TYPE_CONTRACT) |" >> $GITHUB_STEP_SUMMARY
              [ -n "$CERTIFICATE_CONTRACT" ] && echo "| **Certificate** | \`$CERTIFICATE_CONTRACT\` | [View](${{vars.EXPLORE_URL}}/address/$CERTIFICATE_CONTRACT) |" >> $GITHUB_STEP_SUMMARY
              [ -n "$ORGANIZATION_MANAGER" ] && echo "| **OrganizationManager** | \`$ORGANIZATION_MANAGER\` | [View](${{vars.EXPLORE_URL}}/address/$ORGANIZATION_MANAGER) |" >> $GITHUB_STEP_SUMMARY
              [ -n "$CERTIFICATION_TYPE_MANAGER" ] && echo "| **CertificationTypeManager** | \`$CERTIFICATION_TYPE_MANAGER\` | [View](${{vars.EXPLORE_URL}}/address/$CERTIFICATION_TYPE_MANAGER) |" >> $GITHUB_STEP_SUMMARY
              [ -n "$CERTIFICATION_MANAGER" ] && echo "| **CertificationManager** | \`$CERTIFICATION_MANAGER\` | [View](${{vars.EXPLORE_URL}}/address/$CERTIFICATION_MANAGER) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ No contract addresses found (deployment-addresses.txt missing)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ Deployment failed!" >> $GITHUB_STEP_SUMMARY
          fi
