name: Deploy to Ethereum Sepolia Testnet

on:
  push:
    branches:
     - develop

jobs:
  test:
    name: Test Contracts
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run tests
        run: forge test --gas-report
        id: test

      - name: Generate test summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Build and Deploy to Sepolia
    runs-on: ubuntu-latest
    needs: test
    environment: Development

    outputs:
      deployer-address: ${{ steps.deploy.outputs.deployer-address }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build --sizes
        id: build

      - name: Verify environment variables
        run: |
          if [ -z "${{ vars.SEPOLIA_RPC_URL }}" ]; then
            echo "SEPOLIA_RPC_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OWNER_WALLET_PRIVATE_KEY }}" ]; then
            echo "PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "Environment variables verified"

      - name: Deploy contracts
        id: deploy
        env:
          RPC_URL: ${{ vars.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.OWNER_WALLET_PRIVATE_KEY }}
        run: |
          echo "🚀 Starting deployment to Sepolia testnet..."
          
          # Function to deploy with retry logic
          deploy_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=30
            
            while [ $attempt -le $max_attempts ]; do
              echo "Deployment attempt $attempt of $max_attempts..."
              
              # Deploy contracts using forge script
              if forge script script/Deploy.s.sol:DeployScript \
                --rpc-url $RPC_URL \
                --private-key $PRIVATE_KEY \
                --broadcast \
                --verify \
                --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }} \
                --slow \
                -vvvv; then
                echo "Deployment successful!"
                return 0
              else
                echo "Deployment attempt $attempt failed"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting $delay seconds before retry..."
                  sleep $delay
                  delay=$((delay + 30))  # Increase delay for next attempt
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "All deployment attempts failed"
            return 1
          }
          
          # Execute deployment with retry and capture output
          DEPLOYMENT_LOG=$(mktemp)
          deploy_with_retry | tee "$DEPLOYMENT_LOG"
          
          # Extract contract addresses from deployment logs
          if grep -q "=== DEPLOYMENT SUMMARY ===" "$DEPLOYMENT_LOG"; then
            ORGANIZATION_CONTRACT=$(grep "Organization Contract:" "$DEPLOYMENT_LOG" | sed 's/.*Organization Contract: //')
            CERTIFICATE_TYPE_CONTRACT=$(grep "CertificateType Contract:" "$DEPLOYMENT_LOG" | sed 's/.*CertificateType Contract: //')
            CERTIFICATE_CONTRACT=$(grep "Certificate Contract:" "$DEPLOYMENT_LOG" | sed 's/.*Certificate Contract: //')
            ORGANIZATION_MANAGER=$(grep "OrganizationManager:" "$DEPLOYMENT_LOG" | sed 's/.*OrganizationManager: //')
            CERTIFICATION_TYPE_MANAGER=$(grep "CertificationTypeManager:" "$DEPLOYMENT_LOG" | sed 's/.*CertificationTypeManager: //')
            CERTIFICATION_MANAGER=$(grep "CertificationManager:" "$DEPLOYMENT_LOG" | sed 's/.*CertificationManager: //')
            
            # Output contract addresses for summary
            echo "organization-contract=$ORGANIZATION_CONTRACT" >> $GITHUB_OUTPUT
            echo "certificate-type-contract=$CERTIFICATE_TYPE_CONTRACT" >> $GITHUB_OUTPUT
            echo "certificate-contract=$CERTIFICATE_CONTRACT" >> $GITHUB_OUTPUT
            echo "organization-manager=$ORGANIZATION_MANAGER" >> $GITHUB_OUTPUT
            echo "certification-type-manager=$CERTIFICATION_TYPE_MANAGER" >> $GITHUB_OUTPUT
            echo "certification-manager=$CERTIFICATION_MANAGER" >> $GITHUB_OUTPUT
          fi
          
          # Extract deployer address
          DEPLOYER_ADDRESS=$(cast wallet address --private-key $PRIVATE_KEY)
          echo "deployer-address=$DEPLOYER_ADDRESS" >> $GITHUB_OUTPUT
          
          # Clean up temp file
          rm -f "$DEPLOYMENT_LOG"

      - name: Generate build and deployment summary
        run: |
          echo "## � Build & Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Deployment successful to Sepolia testnet!" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Deployer:** \`${{ steps.deploy.outputs.deployer-address }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Deployed Contract Addresses" >> $GITHUB_STEP_SUMMARY
            echo "| Contract Name | Address | Etherscan |" >> $GITHUB_STEP_SUMMARY
            echo "|---------------|---------|-----------|" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ steps.deploy.outputs.organization-contract }}" ]; then
              echo "| **Organization** | \`${{ steps.deploy.outputs.organization-contract }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.organization-contract }}) |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.deploy.outputs.certificate-type-contract }}" ]; then
              echo "| **CertificateType** | \`${{ steps.deploy.outputs.certificate-type-contract }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.certificate-type-contract }}) |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.deploy.outputs.certificate-contract }}" ]; then
              echo "| **Certificate** | \`${{ steps.deploy.outputs.certificate-contract }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.certificate-contract }}) |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.deploy.outputs.organization-manager }}" ]; then
              echo "| **OrganizationManager** | \`${{ steps.deploy.outputs.organization-manager }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.organization-manager }}) |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.deploy.outputs.certification-type-manager }}" ]; then
              echo "| **CertificationTypeManager** | \`${{ steps.deploy.outputs.certification-type-manager }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.certification-type-manager }}) |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.deploy.outputs.certification-manager }}" ]; then
              echo "| **CertificationManager** | \`${{ steps.deploy.outputs.certification-manager }}\` | [View](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.certification-manager }}) |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ Deployment failed!" >> $GITHUB_STEP_SUMMARY
          fi
